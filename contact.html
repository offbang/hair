<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Hair Studio - Contact</title>
   <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>AURA HAIR STUDIO</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services & Gallery</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container" style="max-width: 600px;">
        <h2>Book an Appointment</h2>
        <p style="margin-bottom: 1.5rem;">Reach out directly or send us a message to lock in your session.</p>

        <form style="display: flex; flex-direction: column; gap: 1rem;">
            <label>Name
                <input type="text" placeholder="Your Full Name" required style="width: 100%; padding: 0.75rem; margin-top: 0.25rem;">
            </label>
            <label>Phone / Email
                <input type="text" placeholder="Contact Details" required style="width: 100%; padding: 0.75rem; margin-top: 0.25rem;">
            </label>
            <label>Requested Service
                <select style="width: 100%; padding: 0.75rem; margin-top: 0.25rem;">
                    <option>Haircut & Lineup</option>
                    <option>Coloring & Highlights</option>
                    <option>Braiding / Protective Styles</option>
                    <option>Deep Wash & Treatment</option>
                </select>
            </label>
            <button type="submit" class="btn" style="border: none; cursor: pointer;">Submit Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Aura Hair Studio. All rights reserved.</p>
    </footer>
</body>
</html>
